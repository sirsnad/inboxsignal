<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Inbox - Lane</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="layout">
  <div class="senders-wrap" style="max-width: 640px;">
    <div style="display:flex;align-items:center;gap:12px">
      <a href="/" aria-label="Back to Today" class="pill" style="width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;text-decoration:none">←</a>
      <div>
        <div class="kicker" style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">Lane</div>
        <h1 id="lane-name" style="font-family:var(--display);font-weight:500;font-size:32px;margin:0"></h1>
      </div>
    </div>

    <div class="banner green" id="merge-note" style="font-weight:400"></div>

    <div class="section">
      <div class="section-head"><div class="title" id="lead-title">Today</div></div>
      <div id="cards" style="display:flex;flex-direction:column;gap:10px"></div>
    </div>

    <div class="section hidden" id="also-sec">
      <div class="section-head"><div class="title">Also in this digest</div></div>
      <div class="card-list pad-list" id="also"></div>
    </div>

    <div class="section">
      <div class="section-head"><div class="title">This lane</div></div>
      <div class="card-list pad-list" id="settings"></div>
    </div>
  </div>
</div>
<div class="toast hidden" id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const NAME = decodeURIComponent(location.pathname.split("/").pop());

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  clearTimeout(toast._h);
  toast._h = setTimeout(() => t.classList.add("hidden"), 4000);
}

async function post(url, body) {
  const r = await fetch(url, { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error((await r.json()).detail || r.status);
  return r.json();
}

async function load() {
  const r = await fetch(`/api/lane/${encodeURIComponent(NAME)}`);
  if (!r.ok) { $("lane-name").textContent = NAME; toast("No such lane."); return; }
  const d = await r.json();
  $("lane-name").textContent = d.name;
  document.title = `Signal Inbox - ${d.name} lane`;

  $("merge-note").textContent = d.merged_from
    ? `${d.merged_from} email${d.merged_from > 1 ? "s" : ""} from ${d.sources.join(" and ") || "this lane's sources"} merged into one digest at ${d.digest_time.replace(":00", ":00 am").replace("07", "7")}. Duplicates removed.`
    : `No mail from ${d.sources.join(", ") || "this lane"} in the last day.`;

  const cards = d.items.slice(0, 6);
  $("lead-title").textContent = d.name === "Homes" ? "New listings" : "Today";
  $("cards").innerHTML = cards.map((i) => {
    const badge = i.kind === "price_drop"
      ? `<span style="font-size:12px;font-weight:600;color:var(--terra);background:var(--terra-tint);padding:3px 8px;border-radius:10px">${esc(i.drop || "Price drop")}</span>`
      : `<span style="font-size:12px;font-weight:600;color:var(--green);background:var(--green-tint);padding:3px 8px;border-radius:10px">${
          { job: "Fit", story: "Read", open_house: "Open house", rental: "Rental" }[i.kind] || "New"}</span>`;
    return `<div class="card" style="display:flex;flex-direction:column;gap:6px">
      ${i.price ? `<div style="display:flex;justify-content:space-between;align-items:baseline">
        <div style="font-family:var(--display);font-size:22px;font-weight:500">${esc(i.price)}</div>${badge}</div>` : ""}
      <div style="font-size:14px;font-weight:600">${esc(i.title)}</div>
      <div style="font-size:13px;color:var(--muted)">${esc(i.detail || i.source || "")}${i.opened ? " · you opened this one" : ""}</div>
    </div>`;
  }).join("") || `<div class="banner">Nothing in today's digest yet.</div>`;

  $("also-sec").classList.toggle("hidden", !d.also.length);
  $("also").innerHTML = d.also.map((a) =>
    `<div class="mini-row"><div>${esc(a.label[0].toUpperCase() + a.label.slice(1))}</div><div class="strong dim">${a.count}</div></div>`).join("");

  const snoozeBtn = d.snoozed_until
    ? `<button class="pill" id="unsnooze">Snoozed${d.snooze_reason ? ` · ${esc(d.snooze_reason)}` : ""} - wake</button>`
    : `<button class="pill" id="snooze">Snooze 30 days</button>`;
  $("settings").innerHTML = `
    <div class="mini-row"><div>Digest</div>
      <button class="pill" id="cadence">${esc(d.cadence)} · ${esc(d.digest_time)}</button></div>
    <div class="mini-row"><div>Sources</div><div class="dim">${esc(d.sources.join(", ") || "none yet")}</div></div>
    <div class="mini-row"><div>Snooze lane</div>${snoozeBtn}</div>`;

  $("cadence").addEventListener("click", async () => {
    const next = d.cadence === "daily" ? "weekly" : "daily";
    await post(`/api/lane/${encodeURIComponent(NAME)}/settings`, { cadence: next });
    toast(`Digest is now ${next}.`);
    load();
  });
  const sn = $("snooze");
  if (sn) sn.addEventListener("click", async () => {
    const reason = prompt("Snooze reason (shows on the tile):", "until wedding") || "";
    await post(`/api/lane/${encodeURIComponent(NAME)}/settings`,
               { snooze_days: 30, snooze_reason: reason });
    toast("Lane snoozed for 30 days.");
    load();
  });
  const un = $("unsnooze");
  if (un) un.addEventListener("click", async () => {
    await post(`/api/lane/${encodeURIComponent(NAME)}/settings`, { unsnooze: true });
    toast("Lane awake again.");
    load();
  });
}
load();
</script>
</body>
</html>
